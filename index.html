<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Point Of Interest (POI): pelan paip, sensor dan lokasi kebocoran.">
<meta name="theme-color" content="#0b1014">
<title>Point Of Interest (POI)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* ProKuiz look: dark app shell, chunky 3D gradient buttons, rounded cards, emoji-led actions */
  :root{
    --bg:#0b1014; --panel:#10171d; --card:#16212a; --card2:#1b2833; --field:#0d1419;
    --fg:#eef5f7; --muted:#8ea3ae; --line:#24333f;
    --green:#22c55e; --green-d:#15803d; --blue:#3b82f6; --blue-d:#1d4ed8; --purple:#8b5cf6; --purple-d:#6d28d9;
    --orange:#f59e0b; --orange-d:#b45309; --red:#ef4444; --red-d:#b91c1c; --cyan:#06b6d4;
    --pipe:#3b82f6; --sensor:#8b5cf6; --leak:#ef4444; --warn:#f59e0b; --accent:#22c55e;
    --head:"Baloo 2","Nunito",system-ui,sans-serif; --sans:"Nunito",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;font-family:var(--sans);font-size:14px;color:var(--fg);background:var(--bg)}
  .app{display:grid;grid-template-columns:400px 1fr;height:100%}
  aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;min-width:0;scrollbar-color:#2a3a47 transparent}
  header{padding:16px 16px 14px;background:radial-gradient(120% 140% at 0% 0%,rgba(59,130,246,.22),transparent 60%),radial-gradient(120% 140% at 100% 0%,rgba(34,197,94,.16),transparent 55%);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,#3b82f6,#22c55e);box-shadow:0 4px 0 #0b5d3a,0 6px 16px rgba(34,197,94,.35)}
  header h1{margin:0;font-family:var(--head);font-size:22px;line-height:1;letter-spacing:.2px}
  .by{display:inline-block;margin-top:4px;padding:1px 9px;border-radius:999px;background:#fff;color:#0b1014;font-family:var(--head);font-weight:700;font-size:11px}
  .sec{margin:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:grid;gap:10px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .sec h2{margin:0;font-family:var(--head);font-size:17px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--fg);display:flex;align-items:center;gap:10px}
  .sec h3{margin:0;font-family:var(--head);font-size:15px}
  .sec h2 .n{--c:var(--blue);width:28px;height:28px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.45)}
  .sub{border:1px dashed #2f4252;border-radius:14px;padding:12px;display:grid;gap:9px;background:var(--card2)}
  .hint{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row > input:not([type=checkbox]):not([type=color]),.row > select{flex:1}
  input,select{width:100%;min-width:0;padding:10px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:600;background:var(--field);color:var(--fg)}
  input::placeholder{color:#5f7380;font-weight:500}
  input[type=range]{padding:0;border:none;background:none;accent-color:var(--green)}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--green)}
  input[type=color]{width:30px;height:26px;padding:0;border:2px solid var(--line);border-radius:8px;background:none;cursor:pointer}
  input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
  button{--t:#26343f;--b:#1c2731;--s:#070b0e;
    padding:9px 14px;border:none;border-radius:14px;font-family:var(--head);font-weight:700;font-size:14.5px;line-height:1.15;cursor:pointer;white-space:nowrap;color:#fff;
    background:linear-gradient(180deg,var(--t),var(--b));box-shadow:0 4px 0 var(--s),inset 0 1px 0 rgba(255,255,255,.14);
    transition:transform .08s,box-shadow .08s,filter .15s;position:relative;top:0}
  button:hover{filter:brightness(1.12)}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--s),inset 0 1px 0 rgba(255,255,255,.1)}
  button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
  button.pri{--t:#34d877;--b:#16a34a;--s:#0e5e2d;text-shadow:0 1px 0 rgba(0,0,0,.25)}
  button.blue{--t:#60a5fa;--b:#2563eb;--s:#1e3a8a}
  button.purple{--t:#a78bfa;--b:#7c3aed;--s:#4c1d95}
  button.orange{--t:#fbbf24;--b:#d97706;--s:#7c4a03;color:#1f1300;text-shadow:none}
  button.on{--t:#fde047;--b:#eab308;--s:#854d0e;color:#1f1700;text-shadow:none}
  button.danger{--t:#f87171;--b:#dc2626;--s:#7f1d1d}
  button.x{--t:transparent;--b:transparent;--s:transparent;box-shadow:none;color:#fca5a5;padding:4px 8px;font-size:14px}
  button.x:hover{background:rgba(239,68,68,.15);filter:none}
  button.x:active{transform:none}
  button.big{padding:13px 16px;font-size:16px;border-radius:16px}
  button:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
  button:disabled:active{transform:none}
  label.file{display:grid;place-items:center;gap:4px;padding:16px;border:2px dashed #35506a;border-radius:16px;text-align:center;cursor:pointer;color:#bfdbfe;font-family:var(--head);font-weight:700;font-size:15px;background:rgba(59,130,246,.07)}
  label.file:hover{border-color:var(--blue);background:rgba(59,130,246,.14)}
  label.file input{display:none}
  .status{font-size:13.5px;font-weight:700;padding:10px 12px;border-radius:12px;background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.3)}
  .status.act{background:rgba(245,158,11,.12);color:#fcd34d;border-color:rgba(245,158,11,.35)}
  .item{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;font-size:13px;padding:6px;border-radius:12px;background:var(--card2)}
  .item input:not([type=color]){padding:6px 9px;font-size:13px;border-radius:9px}
  .fine button{padding:6px 11px;font-size:14px;min-height:0}
  .huechip{display:inline-flex;gap:6px;align-items:center;padding:5px 10px!important;font-size:12.5px!important;min-height:0!important}
  .huechip i{width:16px;height:16px;border-radius:5px;border:2px solid #fff;display:inline-block}
  .huechip.off{opacity:.45;filter:grayscale(.6)}
  .huechip.off i{border-style:dashed}
  .hd.rot{border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:15px;line-height:1;background:#fde047}
  .hd.mv.rotating{background:#a78bfa;color:#fff}
  .tpin{width:40px;height:48px;display:grid;place-items:end center;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6));animation:pinDrop .45s cubic-bezier(.2,.9,.3,1.3)}
  .tpin span{font-size:38px;line-height:1}
  @keyframes pinDrop{0%{transform:translateY(-40px);opacity:0}100%{transform:none;opacity:1}}
  .leaflet-tooltip.tpinlbl{font-family:var(--head);font-weight:700;font-size:13px;background:#ef4444;color:#fff;border:2px solid #fff;border-radius:10px;padding:3px 9px}
  @media (prefers-reduced-motion:reduce){.tpin{animation:none}}
  .tilesec{padding:12px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{display:grid;justify-items:start;gap:2px;padding:12px 14px!important;border-radius:18px!important;text-align:left;white-space:normal}
  .tile .tlab{font-size:13.5px;font-weight:700;opacity:.92}
  .tile b{font-family:var(--head);font-size:40px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
  .tile .tsub{font-family:var(--sans);font-size:11.5px;font-weight:600;opacity:.8}
  .tile.tsen{--t:#a78bfa;--b:#7c3aed;--s:#4c1d95}
  .tile.tleak{--t:#f87171;--b:#dc2626;--s:#7f1d1d}
  .tile.tleak.has b{animation:cntPulse 1.6s ease-in-out infinite}
  @keyframes cntPulse{50%{text-shadow:0 0 14px #fff}}
  #map{position:relative}
  .locbtn{position:absolute;left:10px;top:84px;z-index:1000;width:40px;height:40px;padding:0!important;border-radius:12px!important;font-size:18px}
  .plist{display:grid;gap:8px;max-height:62vh;overflow:auto;padding:2px}
  .prow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;text-align:left;padding:10px 12px!important;border-radius:14px!important;white-space:normal;--t:#1d2a35;--b:#16212a;--s:#070b0e}
  .prow .pk{grid-row:1/3;min-width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--head);font-size:17px;font-weight:800;color:#fff;padding:0 8px}
  .prow .pn{font-family:var(--head);font-size:16px}
  .prow .pc{font-family:var(--mono);font-size:13.5px;color:#d8e2e0;grid-column:2}
  .prow .pr{font-family:var(--sans);font-size:12.5px;color:var(--muted);grid-column:2/4;font-weight:600}
  .prow .pgo{grid-row:1/3;grid-column:3;font-size:13px;color:#93c5fd}
  .pempty{color:var(--muted);padding:12px}
  @media (prefers-reduced-motion:reduce){.tile.tleak.has b{animation:none}}
  @media (max-width:760px){.locbtn{top:calc(84px + env(safe-area-inset-top,0px))}.tile b{font-size:34px}}
  header h1{font-size:19px;white-space:nowrap}
  .streetrow{display:grid;gap:8px}
  .streetrow input{width:100%;padding:12px 14px;font-size:15px}
  .streetrow button{width:100%}
  #autoRaster,#autoDxf,#btnUndoAuto{display:none!important}
  .refmk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:13px;color:#111;border:2px solid #111;box-shadow:0 2px 0 #111}
  .refmk.pl{background:#fbbf24}.refmk.mp{background:#4ade80}
  .tutbox{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:1400;width:min(400px,calc(100vw - 32px));
    background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 0 #070b0e,0 18px 40px rgba(0,0,0,.55);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr)}
  .tutbox.big{width:min(760px,calc(100vw - 32px))}
  .tuthead{display:flex;align-items:center;gap:8px;padding:8px 10px;background:radial-gradient(140% 160% at 0 0,rgba(139,92,246,.28),transparent 60%)}
  .tuthead b{flex:1;min-width:0;font-family:var(--head);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tutbtns{display:flex;gap:6px;flex:none}
  .tutbtns button{padding:4px 9px!important;min-height:0!important;font-size:13px!important;border-radius:10px!important}
  #tutCv{display:block;width:100%;aspect-ratio:16/9;background:#f3efe6}
  .tutcap{display:flex;gap:8px;align-items:flex-start;padding:8px 12px 10px;font-size:13.5px;font-weight:600;line-height:1.4;min-height:48px}
  .tutcap .mono{color:#a78bfa;font-weight:700;flex:none}
  .tutbar{height:4px;background:#1f2b35}.tutbar i{display:block;height:100%;width:0;background:#8b5cf6}
  @media (max-width:760px){.tutbox{bottom:calc(var(--sheet,46vh) + 10px)}}
  .sitem{display:grid;grid-template-columns:84px 1fr auto;gap:6px 8px;align-items:center;padding:8px;border-radius:12px;background:var(--card2)}
  .sitem input{padding:6px 9px;font-size:13px;border-radius:9px}
  .sitem .slbl{font-family:var(--head);font-weight:800;text-align:center;background:var(--sensor);border-color:var(--sensor);color:#fff}
  .sitem .scoord{grid-column:1/2;grid-column:1/span 1}
  .sitem .scoord{grid-column:1/3}
  .sitem .sgo{padding:5px 10px;font-size:12.5px;min-height:0}
  .sitem > span.mono{grid-column:1/3;font-size:12px}
  #streetChips button{padding:6px 11px;font-size:13px;white-space:normal;text-align:left}
  .road{grid-column:2/5;font-size:12px;color:var(--muted);margin-top:-2px}
  .mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .chip{width:26px;height:26px;border-radius:9px;color:#fff;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
  .sw{width:24px;height:24px;border-radius:8px;border:2px solid rgba(255,255,255,.25);flex:none}
  .layer{display:grid;grid-template-columns:auto auto 1fr auto;gap:9px;align-items:center;font-size:13.5px;font-weight:600;padding:5px 7px;border-radius:10px;background:var(--card)}
  .layers{display:grid;gap:6px;max-height:230px;overflow:auto}
  .scroll{display:grid;gap:7px;max-height:300px;overflow:auto}
  .result{border:2px solid rgba(239,68,68,.45);border-radius:16px;padding:11px 12px;display:grid;gap:5px;font-size:13.5px;background:linear-gradient(180deg,rgba(239,68,68,.12),rgba(239,68,68,.03))}
  .result b{color:#fca5a5;font-family:var(--head);font-size:15px}
  .result a{color:#93c5fd;font-size:12.5px;font-weight:700}
  .seg{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--field);border:1px solid var(--line)}
  .seg button{flex:1;--t:transparent;--b:transparent;--s:transparent;box-shadow:none;color:var(--muted);padding:7px 10px;border-radius:10px}
  .seg button.on{--t:#60a5fa;--b:#2563eb;--s:#1e3a8a;color:#fff;box-shadow:0 3px 0 var(--s)}
  .seg.lang{flex:none;padding:3px;border-radius:12px}
  .seg.lang button{padding:4px 10px;font-size:12.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid2 label,.lab{font-size:12.5px;font-weight:700;color:var(--muted);display:grid;gap:4px}
  .err{color:#fca5a5;font-size:13px;font-weight:700}
  .coordbig{font-family:var(--mono);font-size:15.5px;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#fff}
  .coordbig button{padding:5px 11px;font-size:12.5px;--t:#60a5fa;--b:#2563eb;--s:#1e3a8a}
  #map{height:100%;min-height:300px;background:#0b1014}
  .leaflet-pane img.plan{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none!important;pointer-events:none}
  .leaflet-control-layers,.leaflet-bar{border:none!important;border-radius:14px!important;overflow:hidden;box-shadow:0 4px 0 #070b0e,0 6px 18px rgba(0,0,0,.4)!important}
  .leaflet-bar a,.leaflet-control-layers{background:#16212a!important;color:#eef5f7!important;border-color:#24333f!important}
  .leaflet-control-layers-expanded{padding:10px 12px!important;font-family:var(--sans);font-weight:600}
  .leaflet-control-layers-toggle{filter:invert(1) hue-rotate(180deg)}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#16212a;color:#eef5f7;border-radius:14px}
  .leaflet-popup-content-wrapper{box-shadow:0 4px 0 #070b0e,0 10px 24px rgba(0,0,0,.45)}
  .leaflet-popup-content{font-family:var(--sans);font-size:13.5px}
  .leaflet-popup-content a{color:#93c5fd;font-weight:700}
  .leaflet-container a.leaflet-popup-close-button{color:#8ea3ae}
  .leaflet-control-attribution{background:rgba(11,16,20,.7)!important;color:#8ea3ae!important}
  .leaflet-control-attribution a{color:#93c5fd!important}
  .leaflet-control-scale-line{background:rgba(11,16,20,.7);color:#eef5f7;border-color:#eef5f7}
  .mk{width:28px;height:28px;border-radius:10px;color:#fff;font-family:var(--head);font-weight:800;font-size:14px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.45)}
  .vx{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--pipe)}
  .hd{width:18px;height:18px;border-radius:5px;background:#fde047;border:2px solid #111;box-shadow:0 2px 0 #111}
  .hd.mv{border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:14px;line-height:1}
  .leakwrap{position:relative;width:60px;height:60px;display:grid;place-items:center}
  .leak{position:relative;width:28px;height:28px;border-radius:50%;background:var(--leak);color:#fff;font-family:var(--head);font-weight:800;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);animation:blink 1s steps(1) infinite}
  .ring{position:absolute;inset:15px;border-radius:50%;border:3px solid var(--leak);animation:pulse 1.6s ease-out infinite}
  .ring.r2{animation-delay:.8s}
  @keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
  @keyframes blink{0%{background:var(--leak)}50%{background:#fde047;color:#000}}
  @media (prefers-reduced-motion:reduce){.ring,.leak{animation:none}button{transition:none}}
  .leaflet-tooltip.tl{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:8px;background:#16212a;color:#eef5f7;border:1px solid #2a3a47}
  .leaflet-tooltip.tl:before{display:none}
  #projMsg{font-weight:600}
  .simbtn{justify-self:start}
  .modal{position:fixed;inset:0;z-index:5000;background:rgba(4,7,9,.88);display:grid;place-items:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
  .mbox{width:min(1180px,100%);display:grid;gap:12px}
  .mhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .mhead b{font-family:var(--head);font-size:20px}
  .mstage{position:relative;width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#0c1210;border:2px solid var(--line);box-shadow:0 6px 0 #070b0e,0 14px 30px rgba(0,0,0,.5)}
  .mstage canvas{display:block;width:100%;height:100%}
  .mload{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-size:20px;color:#bfdbfe;background:rgba(11,16,20,.85)}
  .mctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
  .mctrl input[type=range]{flex:1;min-width:140px}
  .mctrl select{width:auto;padding:8px 10px}
  .mtime{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:96px;text-align:right;font-variant-numeric:tabular-nums}
  .libtab{position:fixed;right:0;top:calc(50% - 30px);z-index:1200;border-radius:16px 0 0 16px!important;padding:12px 12px 12px 14px!important;writing-mode:vertical-rl;text-orientation:mixed;font-size:15px!important;
    --t:#4ade80;--b:#16a34a;--s:#0e5e2d;box-shadow:-3px 4px 0 var(--s),0 8px 20px rgba(0,0,0,.45)!important;margin-right:env(safe-area-inset-right,0px)}
  .libtab span{writing-mode:vertical-rl}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:1300;background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.55);
    transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
  .drawer.open{transform:none}
  .dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
    background:radial-gradient(120% 160% at 100% 0%,rgba(34,197,94,.2),transparent 60%)}
  .dhead b{font-family:var(--head);font-size:20px}
  .dbody{flex:1;overflow-y:auto;padding:12px 14px 16px;display:grid;gap:12px;align-content:start}
  .dform{display:grid;gap:9px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
  .libcard{display:grid;gap:6px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
  .libcard.cur{border-color:#22c55e;box-shadow:inset 0 0 0 1px #22c55e}
  .libcard h4{margin:0;font-family:var(--head);font-size:17px;line-height:1.2}
  .libcard .loc{font-weight:700;color:#bfdbfe;font-size:13.5px}
  .libcard .meta{font-size:12.5px;color:var(--muted)}
  .libcard .note{font-size:13px;color:#d8e2e0}
  .libcard .row button{padding:6px 11px;font-size:13px}
  .chk{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px;color:#d8e2e0}
  .libpin{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:linear-gradient(180deg,#4ade80,#16a34a);border:2px solid #fff;box-shadow:0 3px 0 #0e5e2d}
  .libpop b{font-family:var(--head);font-size:16px}
  .libpop button{margin-top:6px;padding:5px 10px;font-size:12.5px}
  a.abtn{display:inline-block;padding:7px 11px;border-radius:14px;font-family:var(--head);font-weight:700;font-size:13px;line-height:1.15;color:#fff!important;text-decoration:none;white-space:nowrap;
    background:linear-gradient(180deg,#60a5fa,#2563eb);box-shadow:0 4px 0 #1e3a8a,inset 0 1px 0 rgba(255,255,255,.14);transition:transform .08s,box-shadow .08s}
  a.abtn.wa{background:linear-gradient(180deg,#4ade80,#25d366);color:#062b14!important;box-shadow:0 4px 0 #128c4a,inset 0 1px 0 rgba(255,255,255,.25)}
  a.abtn.wa:active{box-shadow:0 1px 0 #128c4a}
  a.abtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1e3a8a}
  a.abtn:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
  .pbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .pbtns button{padding:6px 10px;font-size:12.5px}
  .leakact{display:flex;gap:6px;flex-wrap:wrap}
  .leakact button{padding:7px 11px;font-size:13px}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap}
  .thumbs .th{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:2px solid var(--line);cursor:pointer;padding:0;background:#000;box-shadow:none}
  .thumbs .th img{width:100%;height:100%;object-fit:cover;display:block}
  .thumbs .th:active{transform:none}
  .cropwrap{position:relative;width:100%;max-height:68vh;display:grid;place-items:center;background:#fff;border-radius:16px;overflow:hidden;border:2px solid var(--line);touch-action:none;user-select:none}
  .cropwrap canvas{display:block;max-width:100%;max-height:68vh}
  .cropsel{position:absolute;border:3px solid #22c55e;box-shadow:0 0 0 9999px rgba(8,12,15,.6);cursor:move;border-radius:4px}
  .cropsel i{position:absolute;width:22px;height:22px;background:#fde047;border:2px solid #111;border-radius:6px;box-shadow:0 2px 0 #111}
  .cropsel i[data-h=nw]{left:-12px;top:-12px;cursor:nwse-resize}.cropsel i[data-h=ne]{right:-12px;top:-12px;cursor:nesw-resize}
  .cropsel i[data-h=sw]{left:-12px;bottom:-12px;cursor:nesw-resize}.cropsel i[data-h=se]{right:-12px;bottom:-12px;cursor:nwse-resize}
  .cropsel b{position:absolute;left:6px;top:6px;padding:2px 8px;border-radius:8px;background:#22c55e;color:#062b14;font-family:var(--head);font-size:13px}
  .cropopt{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .cropopt .lab{min-width:180px;flex:1}
  .svframe{width:100%;aspect-ratio:16/9;border:0;border-radius:20px;background:#0c1210;display:block}
  .svimg{width:100%;max-height:72vh;object-fit:contain;border-radius:20px;background:#000;display:block}
  details.set{border-top:1px dashed var(--line);padding-top:10px}
  details.set summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:13px}
  details.set[open] summary{margin-bottom:8px}
  .sheetbar{display:none}
  .modebar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:1250;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
    max-width:calc(100vw - 24px);padding:8px 10px;border-radius:18px;background:rgba(16,23,29,.95);border:1px solid var(--line);box-shadow:0 4px 0 #070b0e,0 10px 26px rgba(0,0,0,.5)}
  .modebar span{font-weight:700;font-size:13.5px;color:#fcd34d;padding:0 4px;max-width:46ch}
  .modebar button{padding:8px 12px;font-size:14px}
  @media (min-width:761px){.modebar{left:calc(50% + 200px)}}
  @media (max-width:760px){
    html,body{overscroll-behavior:none}
    .app{display:block;height:100%}
    #map{position:fixed;inset:0;height:auto;min-height:0;z-index:1}
    aside{position:fixed;left:0;right:0;bottom:0;z-index:1100;height:var(--sheet,46vh);max-height:calc(100% - 56px - env(safe-area-inset-top,0px));border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;
      box-shadow:0 -10px 30px rgba(0,0,0,.5);transition:height .25s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:contain}
    aside.dragging{transition:none}
    .sheetbar{display:flex;position:sticky;top:0;z-index:5;align-items:center;gap:10px;padding:16px 12px 8px 16px;min-height:58px;background:var(--panel);border-radius:24px 24px 0 0;border-bottom:1px solid var(--line);touch-action:none;cursor:grab}
    .sheetbar .grip{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:46px;height:5px;border-radius:3px;background:#3a4b58}
    .sheetbar button{min-height:36px;padding:4px 14px;font-size:15px;flex:none}
    .sheetbar .sstat{flex:1;min-width:0;font-size:13px;font-weight:700;color:#86efac;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    header{padding-top:4px}
    .sec{margin:10px}
    input,select{font-size:16px}
    button{min-height:42px}
    button.x{min-height:32px}
    .item button.x,.layer button{min-height:30px}
    .libtab{top:calc(64px + env(safe-area-inset-top,0px));writing-mode:horizontal-tb;padding:10px 12px!important;border-radius:14px 0 0 14px!important}
    .libtab span{writing-mode:horizontal-tb}
    .leaflet-top{top:env(safe-area-inset-top,0px)}
    .leaflet-bottom{bottom:var(--sheet,46vh)}
    .leaflet-control-layers{margin-top:10px}
    .drawer{width:100vw}
    .sheet-full .libtab{display:none}
    .modal{padding-block:10px;align-items:start}
    .mhead b{font-size:17px}
    .mstage,.svframe{border-radius:14px}
    .modebar{top:calc(8px + env(safe-area-inset-top,0px))}
  }
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="sheetbar" id="sheetBar"><span class="sstat" id="sheetStat"></span><span class="grip"></span><button id="sheetBtn" class="blue" aria-label="Panel">⬆</button></div>
  <header>
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap">
      <div class="brand"><div class="logo" aria-hidden="true">💧</div><div><h1>Point Of Interest (POI)</h1></div></div>
      <div class="seg lang"><button id="lgBM">BM</button><button id="lgEN">EN</button></div>
    </div>
    <p class="hint" data-i18n="subtitle"></p>
  </header>

  <div class="sec tilesec">
    <div class="tiles">
      <button class="tile tsen" id="tileSen"><span class="tlab" data-i18n="tileSen"></span><b id="cntSen">0</b><span class="tsub" data-i18n="tileTap"></span></button>
      <button class="tile tleak" id="tileLeak"><span class="tlab" data-i18n="tileLeak"></span><b id="cntLeak">0</b><span class="tsub" data-i18n="tileTap"></span></button>
    </div>
    <div id="status" class="status" hidden></div>
  </div>

  <!-- 1 PLAN + PIPES -->
  <div class="sec">
    <h2><span class="n" style="--c:#3b82f6">1</span><span data-i18n="s1"></span></h2>
    <label class="file"><span data-i18n="upload"></span><input type="file" id="fileImg" accept="image/*,.pdf,.dxf,.dwg"></label>
    <button class="purple" id="btnTut" data-i18n="tutBtn"></button>
    <div id="loadMsg" class="hint"></div>

    <div id="streetBox" class="sub" hidden>
      <h3 data-i18n="streetsH"></h3>
      <p class="hint" id="streetMsg"></p>
      <div id="streetChips" class="row"></div>
      <div class="streetrow">
        <input id="streetQ" data-i18n-ph="streetSearchPh">
        <button class="blue" id="btnStreetGo" data-i18n="goPlace"></button>
      </div>
    </div>

    <div id="imgTools" hidden style="display:grid;gap:8px">
      <div id="pdfPageBox" class="row" hidden><span class="lab" data-i18n="pdfPage"></span><input id="pdfPage" type="number" min="1" value="1" style="width:80px;flex:none"><span id="pdfPages" class="muted"></span></div>
      <p class="hint" data-i18n="planHint"></p>
      <div class="lab"><span data-i18n="viewH"></span>
        <div class="seg" id="viewSeg"><button data-view="full" data-i18n="viewFull"></button><button data-view="nobg" data-i18n="viewNoBg"></button><button data-view="pipes" data-i18n="viewPipes"></button></div>
      </div>
      <div id="hueBox" hidden style="display:grid;gap:6px">
        <span class="hint" data-i18n="hueHint"></span>
        <div id="hueChips" class="row"></div>
        <label class="lab"><span><span data-i18n="vivid"></span> <span class="mono" id="vividTxt"></span></span><input type="range" id="vivid" min="0" max="100" step="5" value="80"></label>
        <label class="chk"><input type="checkbox" id="thick" checked><span data-i18n="thick"></span></label>
      </div>
      <div class="lab"><span data-i18n="opacity"></span><input type="range" id="op" min="0.1" max="1" step="0.05"></div>
      <div class="row fine">
        <button id="rotL" title="-1°">⟲ 1°</button><button id="rotR" title="+1°">⟳ 1°</button>
        <button id="sclD" title="-2%">➖</button><button id="sclU" title="+2%">➕</button>
        <label class="chk"><input type="checkbox" id="freeMode"><span data-i18n="freeMode"></span></label>
      </div>
      <div class="row">
        <button id="btnRef" class="pri" data-i18n="refBtn"></button>
        <button id="btnTut2" class="purple" aria-label="Video">🎬</button>
        <button id="btnPlaceView" class="blue" data-i18n="placeAtView"></button>
        <button id="btnLock"></button>
        <button id="btnHideImg"></button>
        <button id="btnRecrop" class="orange" data-i18n="recrop" hidden></button>
        <button id="btnDelImg" class="danger" data-i18n="delPlan"></button>
      </div>
      <div id="imgNote" class="hint"></div>

      <div id="autoRaster" class="sub" hidden>
        <h3 data-i18n="autoRH"></h3>
        <p class="hint" data-i18n="autoRHint"></p>
        <div class="row">
          <button id="btnPick" class="orange" data-i18n="pick"></button>
          <span id="pickSw" class="sw" hidden></span><span id="pickTxt" class="mono muted"></span>
        </div>
        <label class="lab"><span><span data-i18n="colTol"></span> <span id="tolTxt" class="mono"></span></span><input type="range" id="colTol" min="15" max="140" value="55"></label>
        <div class="row">
          <label class="lab" style="flex:1"><span data-i18n="pipeName"></span><input id="autoName" data-i18n-ph="pipeNamePh"></label>
          <button class="pri" id="btnDetect" disabled style="align-self:end" data-i18n="detect"></button>
        </div>
      </div>

      <div id="autoDxf" class="sub" hidden>
        <h3 data-i18n="dxfH"></h3>
        <p class="hint" data-i18n="dxfHint"></p>
        <div id="layerList" class="layers"></div>
        <button class="pri" id="btnDxfPipes" data-i18n="dxfConvert"></button>
      </div>
      <div id="autoInfo" class="hint"></div>
      <button id="btnUndoAuto" hidden data-i18n="undoAuto"></button>
    </div>

    <details class="set" id="pipeBox">
      <summary><span data-i18n="manualPipes"></span> <span class="mono" id="pipeCount"></span></summary>
      <div style="display:grid;gap:8px">
        <p class="hint" data-i18n="s2Hint"></p>
        <div class="row">
          <button id="btnPipe" class="pri" data-i18n="drawPipe"></button>
          <button id="btnPipeDone" hidden data-i18n="done"></button>
          <button id="btnPipeUndo" hidden data-i18n="undoPt"></button>
          <button id="btnVx"></button>
          <button id="btnHidePipes"></button>
          <button id="btnRoads" class="blue" data-i18n="roads"></button>
        </div>
        <div id="pipeList" class="scroll"></div>
      </div>
    </details>
  </div>

  <!-- 2 SENSORS + LEAK -->
  <div class="sec">
    <h2><span class="n" style="--c:#8b5cf6">2</span><span data-i18n="s2"></span></h2>
    <p class="hint" data-i18n="s3Hint"></p>
    <div class="sub">
      <h3 data-i18n="addSensorH"></h3>
      <div class="row">
        <input id="newLbl" style="flex:0 0 84px" data-i18n-ph="labelPh">
        <input id="newCoord" data-i18n-ph="coordPh" inputmode="decimal">
      </div>
      <div class="row">
        <button class="purple" id="btnAddSensor" data-i18n="addSensor"></button>
        <button id="btnSensor" class="purple"></button>
      </div>
      <div id="sensorErr" class="err"></div>
    </div>
    <div id="sensorList" class="scroll"></div>

    <h3 data-i18n="leakCalcH" style="margin-top:4px"></h3>
    <div class="grid2">
      <label><span data-i18n="sensorA"></span><select id="selA"></select></label>
      <label><span data-i18n="sensorB"></span><select id="selB"></select></label>
    </div>
    <div id="abInfo" class="mono muted"></div>
    <div class="seg"><button id="mDist" class="on" data-i18n="mDist"></button><button id="mTime" data-i18n="mTime"></button></div>
    <div id="boxDist" class="grid2">
      <label><span data-i18n="measFrom"></span><select id="ref"><option value="A"></option><option value="B"></option></select></label>
      <label><span data-i18n="distAlong"></span><input id="dA" type="number" step="0.1" data-i18n-ph="egDist"></label>
    </div>
    <div id="boxTime" hidden class="grid2">
      <label><span data-i18n="vel"></span><input id="vel" type="number" value="1200" step="10"></label>
      <label>Δt (ms)<input id="dt" type="number" step="0.1" data-i18n-ph="egDt"></label>
      <p class="hint" style="grid-column:1/3;margin:0" data-i18n="dtHint"></p>
    </div>
    <div id="calcOut" class="mono"></div>
    <div class="row">
      <label class="lab" style="flex:1"><span data-i18n="tol"></span><input id="tol" type="number" value="2" step="0.5" min="0"></label>
      <button class="danger big" id="btnLeak" style="align-self:end" data-i18n="markLeak"></button>
    </div>
    <div id="leakErr" class="err"></div>
    <div id="leakList" style="display:grid;gap:8px"></div>
    <input type="file" id="photoIn" accept="image/*" capture="environment" multiple hidden>
  </div>

  <!-- 3 PROJECT + LIBRARY -->
  <div class="sec">
    <h2><span class="n" style="--c:#22c55e">3</span><span data-i18n="s3"></span></h2>
    <input id="projName" data-i18n-ph="projPh">
    <div class="row">
      <button class="pri big" id="btnSaveLib" data-i18n="saveLib"></button>
      <button class="blue" id="btnOpenLib" data-i18n="openLib"></button>
    </div>
    <div class="row">
      <button class="pri" id="btnSaveProj" data-i18n="saveProj"></button>
      <button class="blue" id="btnOpenProj" data-i18n="openProj"></button>
      <input type="file" id="fileProj" accept=".html,.htm,.json" hidden>
    </div>
    <div id="projMsg" class="hint"></div>
  </div>

  <div class="sec">
    <div class="row">
      <button id="btnCsv" class="pri" data-i18n="csv"></button>
      <button id="btnFit" class="blue" data-i18n="fit"></button>
      <button id="btnClear" class="danger" data-i18n="clear"></button>
    </div>
    <details class="set">
      <summary data-i18n="gSet"></summary>
      <div style="display:grid;gap:8px">
        <p class="hint" data-i18n="gHint"></p>
        <div class="row"><input id="gKey" data-i18n-ph="gKeyPh" autocomplete="off"><button class="blue" id="gKeySave" data-i18n="gSave"></button></div>
        <div class="hint" id="gKeyMsg"></div>
      </div>
    </details>
    <div id="confirmClear" hidden class="row">
      <span class="err" data-i18n="clearQ"></span>
      <button id="yesClear" class="danger" data-i18n="yes"></button><button id="noClear" data-i18n="no"></button>
    </div>
  </div>
</aside>
<div id="map"></div>
<button id="btnMe" class="locbtn purple" data-i18n-title="myLoc" aria-label="📍">📍</button>
</div>
<button id="libTab" class="libtab" aria-controls="libDrawer">📚 <span data-i18n="libTab"></span></button>
<div id="libDrawer" class="drawer" aria-hidden="true">
  <div class="dhead"><b data-i18n="libTitle"></b><button id="libClose" class="danger">✕</button></div>
  <div class="dbody">
    <div class="row" id="libTop">
      <button class="pri" id="libNew" data-i18n="libSaveNew"></button>
      <button class="blue" id="libUpdate" hidden></button>
    </div>
    <div class="dform" id="libForm" hidden>
      <b id="libFormTitle" style="font-family:var(--head);font-size:16px"></b>
      <label class="lab"><span data-i18n="libName"></span><input id="libName" data-i18n-ph="libNamePh"></label>
      <div class="grid2">
        <label class="lab"><span data-i18n="libDaerah"></span><input id="libDaerah" data-i18n-ph="libDaerahPh"></label>
        <label class="lab"><span data-i18n="libNegeri"></span><input id="libNegeri" list="negeriList" data-i18n-ph="libNegeriPh"></label>
      </div>
      <datalist id="negeriList"></datalist>
      <label class="lab"><span data-i18n="libNote"></span><input id="libNoteIn" data-i18n-ph="libNotePh"></label>
      <label class="chk"><input type="checkbox" id="libWithData"><span data-i18n="libWithData"></span></label>
      <div class="hint mono" id="libWhere"></div>
      <div class="row">
        <button class="pri" id="libSave" data-i18n="libSave"></button>
        <button class="orange" id="libAuto" data-i18n="libAuto"></button>
        <button id="libCancel" data-i18n="libCancel"></button>
      </div>
      <div class="err" id="libErr"></div>
    </div>
    <div class="row">
      <input id="libQ" data-i18n-ph="libSearchPh">
    </div>
    <div class="row">
      <select id="libFNegeri"></select>
      <select id="libSort" style="flex:none;width:auto"></select>
    </div>
    <div class="hint" id="libCount"></div>
    <div id="libList" style="display:grid;gap:10px"></div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:12px">
      <button class="blue" id="libExport" data-i18n="libExport"></button>
      <button id="libImport" data-i18n="libImport"></button>
      <input type="file" id="libImportFile" accept=".json" hidden>
    </div>
    <div class="hint" id="libMsg"></div>
  </div>
</div>
<div id="tutBox" class="tutbox" hidden role="dialog" aria-labelledby="tutTitle">
  <div class="tuthead"><b id="tutTitle" data-i18n="tutTitle"></b>
    <span class="tutbtns"><button id="tutPlay" class="pri" aria-label="Play"></button><button id="tutRe" class="blue" aria-label="Replay">↺</button><button id="tutBig" aria-label="Resize">⤢</button><button id="tutX" class="danger" aria-label="Close">✕</button></span></div>
  <canvas id="tutCv" width="640" height="360"></canvas>
  <div class="tutcap"><span id="tutStep" class="mono"></span><span id="tutCap"></span></div>
  <div class="tutbar"><i id="tutProg"></i></div>
</div>
<div id="modeBar" class="modebar" hidden><span id="modeTxt"></span><span id="modeBtns" style="display:flex;gap:8px;padding:0"></span></div>
<div id="cropModal" class="modal" hidden>
  <div class="mbox">
    <div class="mhead"><b data-i18n="cropTitle"></b><button id="cropX" class="danger">✕</button></div>
    <p class="hint" data-i18n="cropHint"></p>
    <div class="cropwrap" id="cropWrap"><canvas id="cropCv"></canvas><div class="cropsel" id="cropSel"><b data-i18n="cropMap"></b><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div>
    <div class="mctrl" style="display:grid;gap:10px">
      <div class="row">
        <button class="orange" id="cropAuto" data-i18n="cropAuto"></button>
        <button class="blue" id="cropFull" data-i18n="cropFull"></button>
        <span class="hint" id="cropInfo"></span>
      </div>
      <div class="cropopt">
        <label class="chk"><input type="checkbox" id="cropText" checked><span data-i18n="cropText"></span></label>
        <label class="lab" id="cropSizeBox"><span><span data-i18n="cropSize"></span> <span class="mono" id="cropSizeTxt"></span></span><input type="range" id="cropSize" min="6" max="60" value="26"></label>
        <label class="chk" id="cropLayerBox" hidden><input type="checkbox" id="cropLayers" checked><span data-i18n="cropLayers"></span></label>
      </div>
      <div class="row"><button class="pri big" id="cropOk" data-i18n="cropOk"></button><button id="cropSkip" data-i18n="cropSkip"></button></div>
    </div>
  </div>
</div>
<div id="svModal" class="modal" hidden>
  <div class="mbox">
    <div class="mhead"><b id="svTitle"></b><button id="svClose" class="danger">✕</button></div>
    <div id="svBody"></div>
    <div class="mctrl" id="svCtrl"></div>
  </div>
</div>
<div id="simModal" class="modal" hidden>
  <div class="mbox">
    <div class="mhead"><b id="simTitle"></b><button id="simClose" class="danger">✕</button></div>
    <div class="mstage"><canvas id="simCv" width="1280" height="720"></canvas><div id="simLoad" class="mload" hidden></div></div>

/* Google Maps via the official Map Tiles API (needs a key with "Map Tiles API" enabled) */
async function googleSession(mapType,key,extra){
  const ck='poi-gsess-'+mapType+'-'+LANG;
  try{const c=JSON.parse(localStorage.getItem(ck)||'null');if(c&&c.key===key&&c.exp>Date.now()+3600e3)return c.session;}catch(e){}
  const body=Object.assign({mapType,language:LANG==='en'?'en-GB':'ms-MY',region:'MY',scale:'scaleFactor2x',highDpi:true},extra||{});
  const r=await fetch('https://tile.googleapis.com/v1/createSession?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('session '+r.status);
  const d=await r.json();
  try{localStorage.setItem(ck,JSON.stringify({key,session:d.session,exp:(+d.expiry||0)*1000||Date.now()+86400e3*7}));}catch(e){}
  return d.session;
}
async function setupGoogle(){

    BASES.groad=L.tileLayer(`https://tile.googleapis.com/v1/2dtiles/{z}/{x}/{y}?session=${sr}&key=${encodeURIComponent(key)}`,{maxZoom:22,tileSize:256,attribution:att});

    if($('gKeyMsg'))$('gKeyMsg').textContent=t('gOk');

}

/* snap a point to the nearest pipe segment */
function snap(ll,excl){
  let best=null;
  S.pipes.forEach((p,pi)=>{if(pi===excl)return;let acc=0;
    for(let i=0;i<p.pts.length-1;i++){
      const a=p.pts[i],b=p.pts[i+1],kx=Math.cos(a.lat*Math.PI/180)*111320,ky=110540;
      const bx=(b.lng-a.lng)*kx,by=(b.lat-a.lat)*ky,px=(ll.lng-a.lng)*kx,py=(ll.lat-a.lat)*ky;
      const L2=bx*bx+by*by;let t=L2?(px*bx+py*by)/L2:0;t=Math.max(0,Math.min(1,t));
      const d=Math.hypot(px-t*bx,py-t*by),seg=d2(a,b);
      if(!best||d<best.d)best={d,pi,i,t,s:acc+t*seg,lat:a.lat+t*(b.lat-a.lat),lng:a.lng+t*(b.lng-a.lng)};
      acc+=seg;
    }});
  return best;
}

/* ================= pipe network (shortest path between sensors) ================= */
function buildGraph(extra){
  const N=[],adj=[],ins=new Map();
  const add=ll=>{N.push(ll);adj.push([]);return N.length-1;};
  const link=(a,b)=>{if(a===b)return;const w=d2(N[a],N[b]);adj[a].push([b,w]);adj[b].push([a,w]);};
  const vid=S.pipes.map(p=>p.pts.map(q=>add(q)));
  S.pipes.forEach((p,pi)=>{for(let i=0;i<p.pts.length-1;i++)link(vid[pi][i],vid[pi][i+1]);});
  const onSeg=sn=>{
    if(sn.t<=1e-6)return vid[sn.pi][sn.i];
    if(sn.t>=1-1e-6)return vid[sn.pi][sn.i+1];
    const n=add({lat:sn.lat,lng:sn.lng}),k=sn.pi+':'+sn.i;
    if(!ins.has(k))ins.set(k,[]);ins.get(k).push({t:sn.t,n});return n;
  };
  S.pipes.forEach((p,pi)=>{if(p.pts.length<2)return;[0,p.pts.length-1].forEach(ei=>{
    const sn=snap(p.pts[ei],pi);if(sn&&sn.d<=JOIN)link(vid[pi][ei],onSeg(sn));});});
  const ex=extra.map(onSeg);
  ins.forEach((list,k)=>{const [pi,i]=k.split(':').map(Number);list.sort((a,b)=>a.t-b.t);
    const chain=[vid[pi][i],...list.map(o=>o.n),vid[pi][i+1]];for(let j=0;j<chain.length-1;j++)link(chain[j],chain[j+1]);});
  return{N,adj,ex};
}
function dijkstra(g,s,t){
  const n=g.N.length,dist=new Float64Array(n).fill(Infinity),prev=new Int32Array(n).fill(-1);dist[s]=0;
  const H=[[0,s]];
  const push=x=>{H.push(x);let i=H.length-1;while(i>0){const p=(i-1)>>1;if(H[p][0]<=H[i][0])break;[H[p],H[i]]=[H[i],H[p]];i=p;}};
  const pop=()=>{const top=H[0],last=H.pop();if(H.length){H[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;
    if(l<H.length&&H[l][0]<H[m][0])m=l;if(r<H.length&&H[r][0]<H[m][0])m=r;if(m===i)break;[H[m],H[i]]=[H[i],H[m]];i=m;}}return top;};
  while(H.length){const [d,u]=pop();if(d>dist[u])continue;if(u===t)break;
    for(const [v,w] of g.adj[u]){const nd=d+w;if(nd<dist[v]){dist[v]=nd;prev[v]=u;push([nd,v]);}}}
  if(!isFinite(dist[t]))return null;
  const path=[];for(let u=t;u!==-1;u=prev[u])path.push(g.N[u]);path.reverse();
  return{D:dist[t],path};
}
function along(path,s){
  let acc=0;
  for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1],seg=d2(a,b);
    if(acc+seg>=s||i===path.length-2){const t=seg?Math.max(0,Math.min(1,(s-acc)/seg)):0;return{lat:a.lat+t*(b.lat-a.lat),lng:a.lng+t*(b.lng-a.lng)};}
    acc+=seg;}
  return path[0];
}
const sensorById=id=>S.sensors.find(x=>x.id===id);
const SNAPMAX=15;
function routeAB(A,B){
  const sa=snap(A),sb=snap(B);
  if(sa&&sb&&sa.d<=SNAPMAX&&sb.d<=SNAPMAX){
    const g=buildGraph([sa,sb]),r=dijkstra(g,g.ex[0],g.ex[1]);
    if(r)return r;
  }
  return{D:d2(A,B),path:[{lat:A.lat,lng:A.lng},{lat:B.lat,lng:B.lng}],straight:true};
}
function computeLeak(lk){
  const A=sensorById(lk.a),B=sensorById(lk.b);
  if(!A||!B)return{err:t('notFound')};
  const r=routeAB(A,B);if(r.err)return r;
  if(lk.dA<-1e-6||lk.dA>r.D+1e-6)return{err:t('outRange','',A.label,B.label,fmt(r.D)),D:r.D};
  return{...along(r.path,lk.dA),A,B,D:r.D,path:r.path};
}

const roadCache={};
async function roadAt(lat,lng){
  const k=lat.toFixed(5)+','+lng.toFixed(5);if(roadCache[k]!==undefined)return roadCache[k];
  try{const r=await fetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lng}&limit=1`);const d=await r.json();
    const p=(d.features&&d.features[0]&&d.features[0].properties)||{};
    const st=p.type==='street'?p.name:(p.street||p.name||'');
    const out=[st,p.district||p.locality||p.city].filter(Boolean).join(', ');
    roadCache[k]=out;return out;}catch(e){return '';}
}

let dirty=false;
function markDirty(){dirty=true;$('projMsg').textContent=t('unsaved');$('projMsg').style.color='var(--warn)';}
function save(quiet){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(!quiet)markDirty();}
function saveImg(){
  markDirty();
  try{if(IMG)localStorage.setItem(KEYIMG,JSON.stringify(IMG,(k,v)=>k==='_hues'?undefined:v));else localStorage.removeItem(KEYIMG);$('imgNote').textContent='';}
  catch(e){$('imgNote').textContent=t('tooBig');}
}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S=Object.assign(S,s);}catch(e){}
  try{IMG=JSON.parse(localStorage.getItem(KEYIMG));}catch(e){IMG=null;}
}

/* ================= mode & status ================= */
function setMode(m){
  mode=m;
  $('btnPipe').hidden=m==='pipe';$('btnPipeDone').hidden=m!=='pipe';$('btnPipeUndo').hidden=m!=='pipe';
  $('btnSensor').className=m==='sensor'?'on':'purple';
  $('btnSensor').textContent=m==='sensor'?t('stopSensor'):t('placeSensor');
  $('btnPick').className=m==='pick'?'on':'orange';
  map.getContainer().style.cursor=m?'crosshair':'';
  const mb=$('modeBar');mb.hidden=!m;
  if(m){$('modeBtns').innerHTML=m==='pipe'?`<button class="blue" data-mb="undo">${t('mbUndo')}</button><button class="pri" data-mb="done">${t('mbDone')}</button>`
      :m==='sensor'?`<button class="pri" data-mb="stop">${t('mbStop')}</button>`
      :m==='ref'?`<button class="blue" data-mb="refundo">${t('mbUndo')}</button><button class="pri" data-mb="refdone">${t('mbDone')}</button><button class="danger" data-mb="refcancel">${t('mbCancel')}</button>`
      :`<button class="danger" data-mb="stop">${t('mbCancel')}</button>`;
    if(isMobile())setSheet('peek');}
  status();
}
function status(){
  if(mode==='pipe')setStatusText(t('stDraw',draft.length,draft.length>1?fmt(pipeLen({pts:draft})):''),true);
  else if(mode==='sensor')setStatusText(t('stSensor',letter(S.nextLbl)),true);
  else if(mode==='pick')setStatusText(t('stPick'),true);
  else if(mode==='ref')setStatusText(refStatus(),true);
  else setStatusText(t('stIdle',S.pipes.length,S.sensors.length,S.leaks.length));
}

/* ================= draw ================= */
const totalPts=()=>S.pipes.reduce((a,p)=>a+p.pts.length,0);
const vxOn=()=>S.showVx==null?totalPts()<=400:S.showVx;
function draw(){
  G.clearLayers();
  const showVx=vxOn();
  if(!S.hidePipes)S.pipes.forEach(p=>{
    const col=p.color||COL.pipe;
    const line=L.polyline(p.pts.map(q=>[q.lat,q.lng]),{color:col,weight:5,opacity:.95})
      .bindTooltip(()=>`${esc(p.name)} · ${fmt(pipeLen(p))}${p.road?' · '+esc(p.road):''}`,{sticky:true,className:'tl'}).addTo(G);
    if(showVx)p.pts.forEach(q=>{
      L.marker([q.lat,q.lng],{icon:L.divIcon({className:'',html:`<div class="vx" style="border-color:${col}"></div>`,iconSize:[12,12],iconAnchor:[6,6]}),draggable:true,zIndexOffset:-100}).addTo(G)
        .on('drag',e=>{const ll=e.target.getLatLng();q.lat=ll.lat;q.lng=ll.lng;line.setLatLngs(p.pts.map(r=>[r.lat,r.lng]));})
        .on('dragend',()=>{resnapAll();save();draw();});
    });
  });
  S.sensors.forEach(se=>{
    L.marker([se.lat,se.lng],{icon:L.divIcon({className:'',html:`<div class="mk" style="background:${COL.sensor}">${esc(se.label)}</div>`,iconSize:[24,24],iconAnchor:[12,12]}),draggable:true,zIndexOffset:500}).addTo(G)
      .bindTooltip(`${esc(se.label)}${se.name?' · '+esc(se.name):''}`,{className:'tl',direction:'top',offset:[0,-12]})
      .on('dragend',e=>{const ll=e.target.getLatLng(),s2=snap(ll),on=s2&&s2.d<=SNAPMAX;se.lat=on?s2.lat:ll.lat;se.lng=on?s2.lng:ll.lng;se.free=!on;save();draw();});
  });
  S.leaks.forEach(lk=>{
    const r=computeLeak(lk);if(r.err)return;
    lk.lat=r.lat;lk.lng=r.lng;
    L.polyline(r.path.map(q=>[q.lat,q.lng]),{color:COL.leak,weight:10,opacity:.18,interactive:false}).addTo(G);
    if(lk.tol)L.circle([r.lat,r.lng],{radius:lk.tol,color:COL.leak,weight:1.5,fillOpacity:.15,interactive:false}).addTo(G);
    const from=lk.ref==='B'?r.B:r.A,to=lk.ref==='B'?r.A:r.B,raw=lk.raw??lk.dA;
    const mk=L.marker([r.lat,r.lng],{icon:L.divIcon({className:'',html:'<div class="leakwrap"><span class="ring"></span><span class="ring r2"></span><div class="leak">!</div></div>',iconSize:[60,60],iconAnchor:[30,30]}),zIndexOffset:1000}).addTo(G)
      .bindPopup(()=>`<b style="color:${COL.leak}">${t('leakTarget')}</b><br>${t('fromTo',fmt(raw),esc(from.label),esc(to.label))}${lk.road?'<br>'+esc(lk.road):''}<br><span style="font-family:var(--mono);font-size:14px">${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}</span><br><a href="${gmap(r.lat,r.lng)}" target="_blank" rel="noopener">${t('openG')}</a>
      <div class="pbtns"><a class="abtn wa" href="${waUrl(lk,r)}" target="_blank" rel="noopener">${t('waBtn')}</a></div>`);
    mk._leakId=lk.id;
  });
  if(draft.length){
    L.polyline(draft.map(q=>[q.lat,q.lng]),{color:COL.pipe,weight:4,dashArray:'6 6'}).addTo(G);
    draft.forEach(q=>L.marker([q.lat,q.lng],{icon:div('vx','',12),interactive:false}).addTo(G));
  }
  $('btnVx').textContent=showVx?t('vxHide'):t('vxShow');
  $('btnHidePipes').textContent=S.hidePipes?t('showPipes'):t('hidePipes');$('pipeCount').textContent=S.pipes.length?'('+S.pipes.length+')':'';
  renderSide();
}
function resnapAll(){S.sensors.forEach(se=>{if(se.free)return;const sn=snap(se);if(sn&&sn.d<=SNAPMAX){se.lat=sn.lat;se.lng=sn.lng;}});}

/* ================= side panel ================= */
function renderSide(){
  $('pipeList').innerHTML=S.pipes.map((p,i)=>`<div class="item">
      <input type="color" data-pcol="${i}" value="${p.color||COL.pipe}" title="${t('pipeColour')}">
      <input data-pipe="${i}" value="${esc(p.name)}"><span class="mono">${fmt(pipeLen(p))}</span>
      <button class="x" data-delpipe="${i}" title="${t('delPipe')}">✕</button>
      ${p.road?`<span class="road">${esc(p.road)}</span>`:''}</div>`).join('')||`<span class="hint">${t('noPipes')}</span>`;
  $('sensorList').innerHTML=S.sensors.map((s,i)=>{const sn=snap(s),on=sn&&sn.d<=SNAPMAX;return `<div class="sitem">
      <input class="slbl" data-slbl="${i}" value="${esc(s.label)}" aria-label="${t('labelPh')}">
      <input data-sen="${i}" value="${esc(s.name||'')}" placeholder="${t('sensorNamePh')}">
      <button class="x" data-delsen="${i}" title="${t('delSensor')}">✕</button>
      <input class="mono scoord" data-scoord="${i}" value="${s.lat.toFixed(6)}, ${s.lng.toFixed(6)}" inputmode="decimal">
      <button class="blue sgo" data-sgo="${i}">${t('goSensor')}</button>
      ${on?`<span class="mono muted" title="${t('chTitle')}">CH ${sn.s.toFixed(1)} m</span>`:''}</div>`;}).join('')||`<span class="hint">${t('noSensors')}</span>`;
  const opts=S.sensors.map(s=>`<option value="${s.id}">${esc(s.label)}${s.name?' · '+esc(s.name):''}</option>`).join('');
  const a=$('selA').value,b=$('selB').value;
  $('selA').innerHTML=opts;$('selB').innerHTML=opts;
  if(a&&sensorById(a))$('selA').value=a;
  if(b&&sensorById(b))$('selB').value=b;else if(S.sensors[1])$('selB').value=S.sensors[1].id;
  $('leakList').innerHTML=S.leaks.map((lk,i)=>{const r=computeLeak(lk);
    if(r.err)return `<div class="result"><span class="err">${t('leakN',i+1)}: ${esc(r.err)}</span><button class="x" data-delleak="${i}">${t('del')}</button></div>`;
    const from=lk.ref==='B'?r.B:r.A,to=lk.ref==='B'?r.A:r.B,c=`${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}`;
    return `<div class="result"><div class="row" style="justify-content:space-between"><b>● ${t('leakN',i+1)}</b><button class="x" data-delleak="${i}">✕</button></div>
      <span>${t('fromTo',fmt(lk.raw??lk.dA),`<b style="color:${COL.sensor}">${esc(from.label)}</b>`,esc(to.label))} (${t('pipeAB',esc(r.A.label),esc(r.B.label),fmt(r.D),lk.tol)})</span>
      ${lk.road?`<span>🛣 ${esc(lk.road)}</span>`:''}
      <span class="coordbig"><span>${c}</span><button data-copy="${c}">${t('copy')}</button></span>
      <span><a href="${gmap(r.lat,r.lng)}" target="_blank" rel="noopener">${t('openG')}</a> · <a href="#" data-zoom="${i}">${t('zoomHere')}</a></span>
      <div class="leakact">
        <a class="abtn wa" href="${waUrl(lk,r)}" target="_blank" rel="noopener">${t('waBtn')}</a>
        <button class="orange" data-photoadd="${lk.id}">${t('photoAdd')}</button>
        <button class="purple" data-sim="${i}">${t('simBtn')}</button>
      </div>
      ${(lk.photos||[]).length?`<div class="thumbs">${lk.photos.map((ph,k)=>`<button class="th" data-photoview="${lk.id}:${k}"><img src="${ph}" alt=""></button>`).join('')}</div>`:''}
      </div>`;}).join('');
  calc();status();
  $('cntSen').textContent=S.sensors.length;$('cntLeak').textContent=S.leaks.length;$('tileLeak').classList.toggle('has',S.leaks.length>0);
}
const aside=document.querySelector('aside');
aside.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.pipe!==undefined){S.pipes[+d.pipe].name=t.value;save();}
  if(d.sen!==undefined){S.sensors[+d.sen].name=t.value;save();}
  if(d.slbl!==undefined){S.sensors[+d.slbl].label=t.value.trim()||'?';save();}
});
aside.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.pcol!==undefined){S.pipes[+d.pcol].color=t.value;save();draw();}
  else if(d.scoord!==undefined){const ll=parseLL(t.value),se=S.sensors[+d.scoord];if(ll){se.lat=ll.lat;se.lng=ll.lng;se.free=true;$('sensorErr').textContent='';save();draw();}else{$('sensorErr').textContent=tt('coordBad');}}
  else if(d.sen!==undefined||d.pipe!==undefined||d.slbl!==undefined)draw();
});
aside.addEventListener('click',e=>{
  const d=e.target.dataset;
  if(d.delpipe!==undefined){S.pipes.splice(+d.delpipe,1);resnapAll();save();draw();}
  if(d.delsen!==undefined){const id=S.sensors[+d.delsen].id;S.sensors.splice(+d.delsen,1);S.leaks=S.leaks.filter(l=>l.a!==id&&l.b!==id);save();draw();}
  if(d.delleak!==undefined){S.leaks.splice(+d.delleak,1);save();draw();}
  if(d.sim!==undefined){openSim(S.leaks[+d.sim]);return;}
  if(d.sgo!==undefined){const se=S.sensors[+d.sgo];if(se)map.setView([se.lat,se.lng],19);}
  if(d.zoom!==undefined){e.preventDefault();const lk=S.leaks[+d.zoom];if(lk.lat!=null)map.setView([lk.lat,lk.lng],19);}
  if(d.copy!==undefined){const b=e.target,done=()=>{b.textContent=t('copied');setTimeout(()=>b.textContent=t('copy'),1500);};
    (navigator.clipboard?navigator.clipboard.writeText(d.copy):Promise.reject()).then(done).catch(()=>{
      const t=document.createElement('textarea');t.value=d.copy;document.body.appendChild(t);t.select();try{document.execCommand('copy');done();}catch(_){}t.remove();});}
});

/* ================= leak calc ================= */
function currentAB(){
  const A=sensorById($('selA').value),B=sensorById($('selB').value);
  if(!A||!B||A===B)return null;
  const r=routeAB(A,B);return{...r,A,B};
}
function calc(){
  SEL.clearLayers();
  const c=currentAB();
  $('abInfo').textContent=!c?(S.sensors.length<2?t('need2'):t('pick2'))
    :c.err?c.err:t('pathAB',c.A.label,c.B.label,fmt(c.D))+(c.straight?t('straight'):t('viaPipe'));
  const ro=$('ref').options;ro[0].textContent=c&&c.A?c.A.label:'—';ro[1].textContent=c&&c.B?c.B.label:'—';
  if(c&&!c.err)L.polyline(c.path.map(q=>[q.lat,q.lng]),{color:'#ffd43b',weight:3,dashArray:'2 8',interactive:false}).addTo(SEL);
  $('calcOut').textContent='';
  if(calcMode==='time'&&c&&!c.err){
    const v=+$('vel').value,dt=+$('dt').value/1000;
    if(v&&$('dt').value!==''){const x=(c.D-v*dt)/2;$('calcOut').textContent=t('fromA',c.A.label,c.D.toFixed(1),v,dt.toFixed(4),x.toFixed(2));return{x,c};}
  }
  return{x:null,c};
}
['selA','selB','vel','dt'].forEach(id=>$(id).addEventListener('input',calc));
$('mDist').onclick=()=>{calcMode='dist';$('mDist').className='on';$('mTime').className='';$('boxDist').hidden=false;$('boxTime').hidden=true;calc();};
$('mTime').onclick=()=>{calcMode='time';$('mTime').className='on';$('mDist').className='';$('boxDist').hidden=true;$('boxTime').hidden=false;calc();};
$('btnLeak').onclick=async()=>{
  $('leakErr').textContent='';
  const {x,c}=calc();
  if(!c){$('leakErr').textContent=t('errPick');return;}
  if(c.err){$('leakErr').textContent=c.err;return;}
  let ref='A',raw=calcMode==='dist'?parseFloat($('dA').value):x;
  if(raw==null||isNaN(raw)){$('leakErr').textContent=calcMode==='dist'?t('errDist'):t('errTime');return;}
  if(calcMode==='dist')ref=$('ref').value;
  if(raw<0||raw>c.D){$('leakErr').textContent=t('outRange',fmt(raw),c.A.label,c.B.label,fmt(c.D));return;}
  const lk={id:uid(),a:c.A.id,b:c.B.id,dA:ref==='B'?c.D-raw:raw,ref,raw,tol:Math.max(0,parseFloat($('tol').value)||0)};
  S.leaks.push(lk);save();draw();if(isMobile())setSheet('half');
  map.setView([lk.lat,lk.lng],19);
  G.eachLayer(l=>{if(l._leakId===lk.id)l.openPopup();});
  lk.road=await roadAt(lk.lat,lk.lng);save();renderSide();
};

/* ================= map clicks ================= */
map.on('click',e=>{
  const ll={lat:e.latlng.lat,lng:e.latlng.lng};
  if(mode==='pipe'){draft.push(ll);draw();}
  else if(mode==='sensor'){
    const sn=snap(ll),on=sn&&sn.d<=25;
    S.sensors.push({id:uid(),label:nextLabel(),name:'',lat:on?sn.lat:ll.lat,lng:on?sn.lng:ll.lng,free:!on});save();draw();
  }
  else if(mode==='pick')pickColour(ll);
  else if(mode==='ref')refClick(e.latlng);
});
map.on('dblclick',()=>{if(mode==='pipe')finishPipe();});
$('btnPipe').onclick=()=>{draft=[];setMode('pipe');};
$('btnPipeUndo').onclick=()=>{draft.pop();draw();};
async function finishPipe(){
  if(draft.length>1){const a=draft[draft.length-1],b=draft[draft.length-2];if(d2(a,b)<0.5)draft.pop();}
  let p=null;
  if(draft.length>=2){p={id:uid(),name:t('pipeDefault',S.pipes.length+1),pts:draft};S.pipes.push(p);}
  draft=[];setMode(null);resnapAll();save();draw();
  if(p){const m=along(p.pts,pipeLen(p)/2);p.road=await roadAt(m.lat,m.lng);save();renderSide();}
}
$('btnPipeDone').onclick=finishPipe;
$('btnSensor').onclick=()=>setMode(mode==='sensor'?null:'sensor');
$('btnVx').onclick=()=>{S.showVx=!vxOn();save();draw();};
$('btnRoads').onclick=async()=>{
  const todo=S.pipes.filter(p=>!p.road).slice(0,80);
  if(!todo.length){setStatusText(t('allRoads'));return;}
  let n=0;for(const p of todo){setStatusText(t('findingRoads',++n,todo.length),true);
    const m=along(p.pts,pipeLen(p)/2);p.road=await roadAt(m.lat,m.lng);save();renderSide();await sleep(250);}
  status();
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(mode==='pipe')finishPipe();else if(mode==='ref')refEnd(false);else setMode(null);}});

/* ================= plan overlay ================= */
let imgEl=null,handles=[],mvHandle=null;
function placeImg(){
  if(!IMG||IMG.hidden){if(imgEl)imgEl.style.display='none';return;}
  if(!imgEl){imgEl=document.createElement('img');imgEl.className='plan';map.getPane('plan').appendChild(imgEl);}
  const want=planViewURL();
  if(want&&imgEl.dataset.k!==want){imgEl.src=want;imgEl.dataset.k=want;}
  imgEl.style.display='';
  const [p0,p1,p2]=IMG.c.map(c=>map.latLngToLayerPoint(c)),w=IMG.w,h=IMG.h;
  imgEl.style.width=w+'px';imgEl.style.height=h+'px';imgEl.style.opacity=IMG.op;
  imgEl.style.transform=`matrix(${(p1.x-p0.x)/w},${(p1.y-p0.y)/w},${(p2.x-p0.x)/h},${(p2.y-p0.y)/h},${p0.x},${p0.y})`;
}
/* ---- plan view filter (full / no background / pipes only) ---- */
const VIEWC={};let viewBusy=null;
const VIV=()=>IMG.vivid==null?0.8:IMG.vivid,THK=()=>IMG.thick==null?true:IMG.thick;
function viewKey(){return IMG.src.length+':'+IMG.src.slice(-32)+':'+(IMG.view||'full')+':'+((IMG.hueOff||[]).join(','))+':'+VIV()+':'+THK();}
function vividRGB(r,g,b,f){if(!f)return[r,g,b];const h=hueOf(r,g,b)/60,x=1-Math.abs(h%2-1);let v=[0,0,0];
  if(h<1)v=[1,x,0];else if(h<2)v=[x,1,0];else if(h<3)v=[0,1,x];else if(h<4)v=[0,x,1];else if(h<5)v=[x,0,1];else v=[1,0,x];
  return[r+(v[0]*255-r)*f,g+(v[1]*255-g)*f,b+(v[2]*255-b)*f];}
function planViewURL(){
  if(!IMG.view||IMG.view==='full')return IMG.src;
  const k=viewKey();if(VIEWC[k])return VIEWC[k];
  if(viewBusy!==k){viewBusy=k;buildView(k).then(()=>{viewBusy=null;placeImg();});}
  return null;
}
function loadOrig(){
  const k='o:'+IMG.src.length+':'+IMG.src.slice(-32);if(VIEWC[k])return Promise.resolve(VIEWC[k]);
  return new Promise(res=>{const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=im.naturalWidth;cv.height=im.naturalHeight;
    const g=cv.getContext('2d');g.drawImage(im,0,0);const d=g.getImageData(0,0,cv.width,cv.height);VIEWC[k]={w:cv.width,h:cv.height,d};res(VIEWC[k]);};im.src=IMG.src;});
}
const isCol=(sat,mx,l)=>sat>=28&&mx>=60&&sat/mx>=0.18&&l<238;
const hueOf=(r,g,b)=>{const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;return h<0?h+360:h;};
async function analyseHues(){
  const o=await loadOrig(),d=o.d.data,cnt=new Array(24).fill(0),sum=Array.from({length:24},()=>[0,0,0]);let tot=0;
  for(let i=0;i<d.length;i+=8){const r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];if(a<100)continue;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    if(!isCol(mx-mn,mx,.299*r+.587*g+.114*b))continue;const k=Math.floor(hueOf(r,g,b)/15)%24;cnt[k]++;sum[k][0]+=r;sum[k][1]+=g;sum[k][2]+=b;tot++;}
  const out=[];for(let k=0;k<24;k++)if(tot&&cnt[k]/tot>=0.006)out.push({k,n:cnt[k],c:rgbHex(sum[k].map(v=>v/cnt[k]))});
  // merge neighbouring buckets of the same colour family
  const groups=[];out.forEach(h=>{const g=groups.find(G=>G.ks.some(x=>Math.min((x-h.k+24)%24,(h.k-x+24)%24)<=1));if(g){g.ks.push(h.k);if(h.n>g.n){g.n=h.n;g.c=h.c;}}else groups.push({ks:[h.k],n:h.n,c:h.c});});
  return groups.sort((a,b)=>b.n-a.n).slice(0,8);
}
async function buildView(key){
  const o=await loadOrig(),w=o.w,h=o.h,src=o.d.data,out=new ImageData(w,h),d=out.data,off=new Set(IMG.hueOff||[]),mode=IMG.view;
  const keep=new Uint8Array(w*h),vf=VIV(),tk=THK();
  for(let i=0,j=0;j<w*h;i+=4,j++){const r=src[i],g=src[i+1],b=src[i+2],a=src[i+3];if(a<20)continue;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx-mn,l=.299*r+.587*g+.114*b;
    if(mode==='pipes'){if(isCol(sat,mx,l)&&!off.has(Math.floor(hueOf(r,g,b)/15)%24)){const v=vividRGB(r,g,b,vf);d[i]=v[0];d[i+1]=v[1];d[i+2]=v[2];d[i+3]=255;keep[j]=1;}}
    else{ // no background: white goes transparent, dark lines fade in by darkness
      const col=isCol(sat,mx,l);let al=col?255:Math.max(0,Math.min(255,(232-l)*4));if(off.size&&col&&off.has(Math.floor(hueOf(r,g,b)/15)%24))al=0;

  const [ox0,oy0]=IMG.crop,ok=IMG.cropK||1,f=(sx,sy)=>{const ll=pix2ll((sx-ox0)*ok,(sy-oy0)*ok);return[ll.lat,ll.lng];};

function applyCrop(full){

let pdfDoc=null;
async function loadPdf(f){
  msg(t('readPdf'));

    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  $('pdfPage').max=pdfDoc.numPages;$('pdfPage').value=1;$('pdfPages').textContent=t('of',pdfDoc.numPages);
  await renderPdfPage(1,false);

async function renderPdfPage(n,keep){
  const page=await pdfDoc.getPage(n),v1=page.getViewport({scale:1});
  const sc=Math.min(5,3000/Math.max(v1.width,v1.height)),vp=page.getViewport({scale:sc});
  const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:cx,viewport:vp}).promise;
  let pdfText=[];try{const tc=await page.getTextContent();const rows={};tc.items.forEach(it=>{const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it);});
    pdfText=Object.values(rows).map(r=>r.sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' '));}catch(e){}

}

function aci(n){

  if(n<10)return base[n]||'#000000';
  if(n>=250){const g=[51,91,132,173,214,255][n-250];return rgbHex([g,g,g]);}
  const b=n-10,h=Math.floor(b/10)*15,k=b%10,v=[1,1,.8,.8,.6,.6,.5,.5,.3,.3][k],s=k%2?0.5:1;
  const f=x=>{const kk=(x+h/60)%6;return v-v*s*Math.max(0,Math.min(kk,4-kk,1));};
  return rgbHex([f(5)*255,f(3)*255,f(1)*255]);

function parseDXF(txt){

  for(let i=0;i+1<Ls.length;i+=2){const c=parseInt(Ls[i]);if(!isNaN(c))P.push([c,Ls[i+1].trim()]);}

  const read=()=>{const e={type:P[i][1],g:[]};i++;while(i<P.length&&P[i][0]!==0){e.g.push(P[i]);i++;}return e;};
  while(i<P.length){
    const [c,v]=P[i];
    if(c===0&&v==='SECTION'){sec=P[i+1]&&P[i+1][1];i+=2;continue;}
    if(c===0&&v==='ENDSEC'){sec=null;i++;continue;}
    if(sec==='TABLES'&&c===0&&v==='LAYER'){const e=read();const tc=gv(e,420);
      layers[gv(e,2)]={col:tc!==undefined?'#'+(+tc).toString(16).padStart(6,'0'):aci(Math.abs(gn(e,62,7)))};continue;}
    if(sec==='ENTITIES'&&c===0){ents.push(read());continue;}
    if(sec==='BLOCKS'&&c===0&&v==='BLOCK'){

      while(i<P.length&&!(P[i][0]===0&&P[i][1]==='ENDBLK')){if(P[i][0]===0)list.push(read());else i++;}
      i++;blocks[gv(b,2)]={x:gn(b,10),y:gn(b,20),ents:list};continue;

function gv(e,c){const p=e.g.find(q=>q[0]===c);return p?p[1]:undefined;}
function gn(e,c,d=0){const v=parseFloat(gv(e,c));return isNaN(v)?d:v;}

      case 'INSERT':{const b=d.blocks[gv(e,2)];if(!b)break;

    }

const SKIPLAYER=/title|border|frame|kotak|tajuk|legend|petunjuk|note|nota|defpoints|viewport|vport|sheet|logo|revision|revisi|stamp|^tb[_\-]|[_\-]tb$|^tb$|anno|dim/i;
function buildDXF(d,opt={}){

  if(opt.skipLayers){lines=lines.filter(l=>!SKIPLAYER.test(l.layer));texts=texts.filter(x=>!SKIPLAYER.test(x.layer||''));}
  if(opt.noText)texts=[];
  if(opt.crop){const c=opt.crop,inside=p=>p[0]>=c.x0&&p[0]<=c.x1&&p[1]>=c.y0&&p[1]<=c.y1;
    lines=lines.filter(l=>{for(let i=0;i<l.pts.length;i++){if(inside(l.pts[i]))return true;if(i&&inside([(l.pts[i][0]+l.pts[i-1][0])/2,(l.pts[i][1]+l.pts[i-1][1])/2]))return true;}return false;});
    texts=texts.filter(tx=>inside(tx.p));
    const byLayer={};lines.forEach(l=>{(byLayer[l.layer]=byLayer[l.layer]||{n:0,col:(d.layers[l.layer]&&d.layers[l.layer].col)||l.col}).n++;});
    return{lines,texts,byLayer,x0:c.x0,y1:c.y1,W:c.x1-c.x0,H:c.y1-c.y0,sc:3000/Math.max(c.x1-c.x0,c.y1-c.y0)};}

  const xs=[],ys=[];lines.forEach(l=>l.pts.forEach(p=>{if(isFinite(p[0])&&isFinite(p[1])){xs.push(p[0]);ys.push(p[1]);}}));
  texts.forEach(t=>{xs.push(t.p[0]);ys.push(t.p[1]);});
  xs.sort((a,b)=>a-b);ys.sort((a,b)=>a-b);

const lum=hex=>{const n=parseInt(hex.slice(1),16);return(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255;};
function renderDXF(D){
  const cv=document.createElement('canvas');cv.width=Math.max(50,Math.round(D.W*D.sc));cv.height=Math.max(50,Math.round(D.H*D.sc));
  const cx=cv.getContext('2d'),X=p=>(p[0]-D.x0)*D.sc,Y=p=>(D.y1-p[1])*D.sc;
  cx.lineJoin='round';cx.lineCap='round';

function joinChains(segs,tol){

$('btnDxfPipes').onclick=()=>{

  if(!sel.length){$('autoInfo').textContent=t('tickLayer');return;}

    const byCol={};DXF.lines.filter(l=>l.layer===layer).forEach(l=>{(byCol[l.col]=byCol[l.col]||[]).push(l.pts);});
    Object.entries(byCol).forEach(([col,segs])=>{
      joinChains(segs,ext*2e-5).forEach(ch=>{
        let len=0;for(let i=0;i<ch.length-1;i++)len+=Math.hypot(ch[i+1][0]-ch[i][0],ch[i+1][1]-ch[i][1]);

function libTx(mode,fn){return libDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('sites',mode),st=tx.objectStore('sites');const q=fn(st);

async function saveBlob(blob,name){
  const C=window.Capacitor,P=C&&C.Plugins;
  if(NATIVE&&P&&P.Filesystem){
    const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(blob);});
    let uri=null,docs=false;
    try{const w=await P.Filesystem.writeFile({path:'POI-Noise-Logger/'+name,data:b64,directory:'DOCUMENTS',recursive:true});uri=w.uri;docs=true;}
    catch(e){try{const w=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});uri=w.uri;}catch(_){}}
    if(docs)setStatusText(t('savedDocs',name));
    if(uri&&P.Share){try{await P.Share.share({title:name,files:[uri]});}catch(_){}}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

// plan transform: world -> screen, interpolated from wrong (k=0) to correct (k=1)
function tutT(k){const s=.66+(1-.66)*k,r=(-14*(1-k))*Math.PI/180,dx=70*(1-k),dy=28*(1-k),cx=320,cy=185;
  return p=>{const x=p.x-cx,y=p.y-cy;return{x:cx+dx+s*(x*Math.cos(r)-y*Math.sin(r)),y:cy+dy+s*(x*Math.sin(r)+y*Math.cos(r))};};}
function tutRoads(g,f,edge,fill,w){
  const R=[[[0,105],[640,105]],[[0,262],[640,262]],[[150,0],[150,360]],[[500,0],[500,360]],[[320,105],[320,262]],[[0,330],[260,200]]];
  [[edge,w+6],[fill,w]].forEach(([c,lw])=>{g.strokeStyle=c;g.lineWidth=lw;g.lineCap='round';R.forEach(([a,b])=>{const A=f({x:a[0],y:a[1]}),B=f({x:b[0],y:b[1]});g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.stroke();});});
}
function tutMap(g){

  g.fillStyle='#e4ddcf';[[20,20,110,70],[175,20,125,70],[340,20,140,70],[525,20,100,70],[20,125,110,115],[175,125,125,115],[340,125,140,115],[525,125,100,115],[175,285,300,60],[525,285,100,60]].forEach(b=>g.fillRect(...b));
  g.fillStyle='#cfe8c4';g.fillRect(345,130,130,105);

function tutPlan(g,k,alpha){

/* street names from the drawing */
const KW='JALAN|JLN|LORONG|LRG|PERSIARAN|PSRN|LEBUHRAYA|LEBUH|LINGKARAN|LENGKOK|LENGKUNGAN|TAMAN|TMN|KAMPUNG|KAMPONG|KG|BANDAR|PRESINT|PERSINT|SEKSYEN|DESA|TAMAN';
const EXP={JLN:'JALAN',LRG:'LORONG',TMN:'TAMAN',KG:'KAMPUNG',KAMPONG:'KAMPUNG',PSRN:'PERSIARAN'};
const STOP=/\s+(KE|DARI|ARAH|TO|FROM|SKALA|SCALE|LOT|NO\.?|NOTA|NOTE|PAIP|PIPE|MM|DIA|TARIKH|DATE)\b.*$/;
function findStreets(lines){
  const re=new RegExp(`\\b(${KW})\\.?\\s+[A-Z0-9][A-Z0-9'\\/\\-\\. ]{1,34}`,'g'),out=new Map();
  lines.forEach(line=>{const u=' '+String(line).toUpperCase().replace(/\s+/g,' ')+' ';let m;
    while((m=re.exec(u))){let n=m[0].replace(STOP,'').replace(/[\s.\-\/]+$/,'').trim();
      const w=n.split(' ');if(EXP[w[0].replace('.','')])w[0]=EXP[w[0].replace('.','')];n=w.join(' ');
      if(n.length>=7&&n.split(' ').length<=6&&!out.has(n))out.set(n,1);}});
  const arr=[...out.keys()],isArea=n=>/^(TAMAN|KAMPUNG|BANDAR|DESA|PRESINT|PERSINT|SEKSYEN)\b/.test(n);
  return arr.filter(n=>!isArea(n)).concat(arr.filter(isArea)).slice(0,12);
}
let STREETS=[];
function showStreets(list,msgTxt){
  STREETS=list;$('streetBox').hidden=false;$('streetMsg').textContent=msgTxt||(list.length?t('streetsFound',list.length):t('ocrNone'));
  $('streetChips').innerHTML=list.map((n,i)=>`<button class="${/^(TAMAN|KAMPUNG|BANDAR|DESA)/.test(n)?'orange':'blue'}" data-street="${i}">${esc(n)}</button>`).join('');
}
async function geocodePlace(name){
  const area=STREETS.find(n=>/^(TAMAN|KAMPUNG|BANDAR|DESA|SEKSYEN|PRESINT)/.test(n)&&n!==name);
  const qs=area&&!/^(TAMAN|KAMPUNG|BANDAR|DESA)/.test(name)?[name+' '+area,name]:[name];
  for(const q of qs){try{const r=await fetch('https://photon.komoot.io/api/?limit=1&bbox=99.6,0.8,119.3,7.4&q='+encodeURIComponent(q));const d=await r.json();
    if(d.features&&d.features.length){const f=d.features[0],[lng,lat]=f.geometry.coordinates;return{lat,lng,name:f.properties&&f.properties.name};}}catch(e){}}
  return null;
}
async function goPlace(name){
  if(!name)return;$('streetMsg').textContent=t('flying',name);
  const ll=await geocodePlace(name);
  if(!ll){$('streetMsg').textContent=t('geoNone',name);return;}
  map.setView([ll.lat,ll.lng],18);dropPin(ll.lat,ll.lng,ll.name||name);
  setTimeout(()=>{if(IMG&&!IMG.locked)placePlanAtView();if(isMobile())setSheet('peek');},350);
  $('streetMsg').textContent=t('flying',name);
}

let ocrRun=0;
async function detectStreetNames(src,autoGo){
  const run=++ocrRun;let lines=[];
  try{
    if(src.kind==='dxf'&&src.raw){const L2=[],T2=[];walkDXF(src.raw.ents,src.raw,p=>p,null,L2,T2,0);lines=T2.map(x=>x.s);}
    else if(src.pdfText&&src.pdfText.length)lines=src.pdfText;
    let list=findStreets(lines);
    if(!list.length&&src.kind!=='dxf'&&src.canvas){
      showStreets([],t('ocrBusy'));
      if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
      const c=src.canvas,k=Math.min(1,2600/Math.max(c.width,c.height)),cv=document.createElement('canvas');cv.width=Math.round(c.width*k);cv.height=Math.round(c.height*k);
      cv.getContext('2d').drawImage(c,0,0,cv.width,cv.height);
      const w=await Tesseract.createWorker('eng');const res=await w.recognize(cv);await w.terminate();
      if(run!==ocrRun)return;
      list=findStreets(res.data.text.split('\n'));

    if(run!==ocrRun)return;
    showStreets(list);
    if(autoGo&&list.length)goPlace(list[0]);
  }catch(e){console.error(e);if(run===ocrRun)showStreets([],t('ocrFail'));}
}

  save(true);try{if(IMG)localStorage.setItem(KEYIMG,JSON.stringify(IMG));else localStorage.removeItem(KEYIMG);}catch(e){}
  draw();placeImg();drawHandles();renderLayers();
  $('btnUndoAuto').hidden=!S.lastAuto;$('autoInfo').textContent='';
  if(fitView&&o.view)map.setView([o.view.lat,o.view.lng],o.view.z);else $('btnFit').click();
  dirty=false;
}
$('btnSaveProj').onclick=saveProject;
$('btnOpenProj').onclick=()=>$('fileProj').click();
$('fileProj').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;e.target.value='';
  try{
    let txt=await f.text(),o;
    if(/\.json$/i.test(f.name))o=JSON.parse(txt);
    else{const i=txt.indexOf(OPEN_TAG),j=txt.indexOf(CLOSE_TAG,i);if(i<0||j<0)throw 0;o=JSON.parse(txt.slice(i+OPEN_TAG.length,j));}
    if(!o||o.app!=='poi-noise-logger')throw 0;
    applyProject(o,true);$('projMsg').textContent=t('opened',f.name);$('projMsg').style.color='';
  }catch(err){$('projMsg').textContent=t('openFail');$('projMsg').style.color='var(--leak)';}
};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveProject();}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=t('leaveWarn');}});
$('projName').addEventListener('input',markDirty);

/* ================= start ================= */
function setLang(l){LANG=l;try{localStorage.setItem('poi-lang',l);}catch(e){}
  applyStatic();setupGoogle();setMode(mode);draw();drawHandles();libRender();
  if(pdfDoc)$('pdfPages').textContent=t('of',pdfDoc.numPages);}
$('lgBM').onclick=()=>setLang('bm');$('lgEN').onclick=()=>setLang('en');
applyStatic();setMode(null);
libLoad();
let EMB=null;try{const raw=$('poi-data').textContent.trim();if(raw)EMB=JSON.parse(raw);}catch(e){}
if(EMB&&EMB.app==='poi-noise-logger'){applyProject(EMB,true);$('projMsg').textContent=t('opened',(EMB.name||'')+'');}
else{
  load();
  draw();placeImg();drawHandles();
  $('btnUndoAuto').hidden=!S.lastAuto;
  rebuildPlanCanvas();
  if(IMG&&IMG.kind==='dxf')$('autoInfo').textContent=t('dxfReload');
  $('btnFit').click();
  $('projMsg').textContent=t('saveHint');
}
fillLeakRoads();
</script>
</body>
</html>
